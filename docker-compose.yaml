services:

  # Certificate generation
  certs:
    image: alpine
    command: >
      sh -c "
        apk add --no-cache openssl;
        cd /cert
        for i in geoshop-back geoshop-front extract zitadel
        do
          sh gencert.sh $$i
        done;
        chmod a=rwx -R /cert # Only for local run!
      "
    volumes:
      - ./volumes/cert:/cert
      - ./volumes/geoshop-back/keys:/keys

  # Zitadel
  zitadel-db:
    restart: 'always'
    image: postgres:17-alpine
    environment:
      PGUSER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./volumes/zitadel/postgres-data:/var/lib/postgresql/data
      - ./volumes/cert:/usr/local/share/ca-certificates/geoshop
    depends_on:
      certs:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "zitadel", "-U", "postgres"]
      interval: '10s'
      timeout: '30s'
      retries: 5
      start_period: '5s'

  # Default user:
  #   name: zitadel-admin@zitadel.localhost
  #   password: Password1!
  zitadel:
    image: 'ghcr.io/zitadel/zitadel:latest'
    command: 'start-from-init --init-projections --masterkey "MasterkeyNeedsToHave32Characters" --config /config.yaml --steps /config.yaml'
    environment:
      ZITADEL_PORT: 443
      ZITADEL_EXTERNALPORT: 443
      ZITADEL_EXTERNALSECURE: true
      ZITADEL_EXTERNALDOMAIN: zitadel
      ZITADEL_TLS_ENABLED: true
      ZITADEL_TLS_CERTPATH: /cert/zitadel.crt
      ZITADEL_TLS_KEYPATH: /cert/zitadel.key

      # database configuration
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel-db
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable

      # Workaround for https://github.com/zitadel/zitadel-charts/issues/127
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: false
    volumes:
      - ./volumes/zitadel/machinekey:/machinekey
      - ./zitadel/config.yaml:/config.yaml
      - ./volumes/cert:/cert
      - ./volumes/cert:/etc/ssl/certs/
    ports:
      - 8443:443
    depends_on:
      certs:
        condition: service_completed_successfully
      zitadel-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 10s
      retries: 15

  # Geoshop
  geoshop-back-db:
    image: postgis/postgis:14-3.2-alpine
    env_file: ./geoshop-back/geoshop-back.env
    volumes:
      - ./volumes/geoshop-back/postgres-data:/var/lib/postgresql/data
    depends_on:
      certs:
        condition: service_completed_successfully
      zitadel:
        condition: service_healthy
    healthcheck:
      test: pg_isready -h 127.0.0.1 -U geoshop -d geoshop
      interval: 5s
      timeout: 5s
      retries: 5

  geoshop-back-db-migrate:
    build: ./geoshop-back
    depends_on:
      certs:
        condition: service_completed_successfully
      geoshop-back-db:
        condition: service_healthy
      zitadel:
        condition: service_healthy
    env_file: ./geoshop-back/geoshop-back.env
    volumes:
      - ./volumes/cert:/usr/local/share/ca-certificates/geoshop
      - ./volumes/cert:/cert
    command: >
      bash -c "
      update-ca-certificates &&
      python3 manage.py migrate &&
      python3 manage.py fixturize &&
      python3 manage.py seed"

  geoshop-back:
    build: ./geoshop-back
    depends_on:
      certs:
        condition: service_completed_successfully
      geoshop-back-db-migrate:
        condition: service_completed_successfully
      geoshop-back-db:
        condition: service_healthy
      zitadel:
        condition: service_healthy
    env_file: ./geoshop-back/geoshop-back.env
    command: >
      bash -c "
      update-ca-certificates &&
      gunicorn wsgi -b :8000 --timeout 90"
    volumes:
      - ./volumes/geoshop-back/keys:/keys
      - ./volumes/cert:/usr/local/share/ca-certificates/geoshop
      - ./volumes/cert:/cert
    healthcheck:
      test: curl -L --fail http://localhost:8000/api || exit 1
      interval: 10s
      timeout: 10s
      retries: 15

  geoshop-front:
    build: ./geoshop-front
    depends_on:
      certs:
        condition: service_completed_successfully
      geoshop-back:
        condition: service_healthy
      zitadel:
        condition: service_healthy
    environment:
      - CURL_CA_BUNDLE=/cert/geoshop-ca.crt
    volumes:
      - ./volumes/cert:/usr/local/share/ca-certificates/geoshop
      - ./volumes/cert:/cert
      - ./volumes/geoshop-front/config.json:/usr/share/nginx/html/de/assets/configs/config.json
      - ./volumes/geoshop-front/config.json:/usr/share/nginx/html/en/assets/configs/config.json
      - ./volumes/geoshop-front/config.json:/usr/share/nginx/html/fr/assets/configs/config.json
    healthcheck:
      test: curl -L --fail https://geoshop-front/ || exit 1
      interval: 10s
      timeout: 10s
      retries: 15

  # Extract
  extract-db:
    image: postgis/postgis:14-3.2-alpine
    environment:
      - POSTGRES_DB=extract
      - POSTGRES_USER=extractuser
      - POSTGRES_PASSWORD=demopassword
      - GEOSHOP_BACKEND=http://geoshop-back:8000
    depends_on:
      certs:
        condition: service_completed_successfully
    volumes:
      - ./volumes/extract/postgres-data:/var/lib/postgresql/data
      - ./volumes/cert/:/usr/local/share/ca-certificates/geoshop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U extractuser -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  extract-db-update:
    image: postgis/postgis:14-3.2-alpine
    environment:
      - POSTGRES_HOST=extract-db
      - POSTGRES_DB=extract
      - POSTGRES_USER=extractuser
      - PGPASSWORD=demopassword
      - GEOSHOP_BACKEND=http://geoshop-back:8000
    depends_on:
      certs:
        condition: service_completed_successfully
      extract-db:
        condition: service_healthy
    volumes:
      - ./extract/db:/updatedb
    entrypoint: /updatedb/update.sh

  extract-base:
    build: ./extract
    depends_on:
      certs:
        condition: service_completed_successfully
      extract-db:
        condition: service_healthy
      geoshop-back:
        condition: service_healthy
    environment:
      - JAVA_OPTS=-Xms1G -Xmx2G
        -Duser.language=en -Duser.region=CH -Dcom.sun.jndi.ldap.connect.pool.timeout=20000
      - ENCRYPTION_SECRET=12345678901234567890123456789012
      - ENCRYPTION_SALT=12345678901234567890123456789012
      - EXTERNAL_URL=https://extract
      - GEODATA_POSTGRES_HOST=extract-db
    volumes:
      - ./volumes/cert:/cert
      - ./volumes/cert/:/usr/local/share/ca-certificates/
    healthcheck:
      test: curl -L --fail http://localhost:8080/extract || exit 1
      interval: 10s
      timeout: 10s
      retries: 15

  # Admin password is "QrF^x5\SQrF^x5\S"
  # external_provider password: QrF^x5\S
  extract:
    image: nginx
    volumes:
      - ./extract/config/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./volumes/cert:/usr/local/share/ca-certificates/geoshop
      - ./volumes/cert:/cert
    environment:
      - CURL_CA_BUNDLE=/cert/geoshop-ca.crt
    depends_on:
      certs:
        condition: service_completed_successfully
      extract-base:
        condition: service_healthy
    healthcheck:
      test: curl -L --fail https://extract/extract || exit 1
      interval: 10s
      timeout: 10s
      retries: 15

  selenium:
    image: selenium/standalone-firefox
    ports:
      - 5900:5900
    environment:
      DISPLAY: :99
    depends_on:
      certs:
        condition: service_completed_successfully
    volumes:
      - ./volumes/geoshop-back/keys:/keys
      - ./volumes/cert/:/usr/local/share/ca-certificates/geoshop
      - ./volumes/cert:/cert
    healthcheck:
      test: curl --fail http://localhost:4444/ || exit 1
      interval: 10s
      timeout: 10s
      retries: 15

  tests:
    profiles:
      - testing
    build: ./tests
    env_file: ./common.env
    environment:
      - GEOSHOP_FRONT=https://geoshop-front
      - GEOSHOP_BACK=https://geoshop-front/api
      - TEST_OUTPUT=${TEST_OUTPUT:-/test_output/}
      - SELENIUM_HOST=http://selenium:4444
    volumes:
      - ./test_output:${TEST_OUTPUT:-/test_output/}
      - ./tests:/tests
    depends_on:
      selenium:
        condition: service_healthy
      geoshop-front:
        condition: service_healthy
      zitadel:
        condition: service_healthy

  setup:
    build: ./setup
    profiles: ["setup", "testing"]
    depends_on:
      certs:
        condition: service_completed_successfully
      extract:
        condition: service_healthy
      selenium:
        condition: service_healthy
      zitadel:
        condition: service_healthy
      geoshop-front:
        condition: service_healthy
      geoshop-back:
        condition: service_healthy
    volumes:
      - ./setup:/setup
      - ./volumes/cert:/cert
      - ./volumes/geoshop-back/keys:/keys
    entrypoint: ["sh", "-x", "/setup/setup.sh"]